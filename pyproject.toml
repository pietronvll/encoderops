[project]
name = "encoderops"
version = "0.1.0"
description = "Reference implementation for self-supervised evolution operator learning on climate, molecular dynamics, and toy dynamical systems."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Giacomo Turri" },
    { name = "Luigi Bonati" },
    { name = "Kai Zhu" },
    { name = "Massimiliano Pontil" },
    { name = "Pietro Novelli" },
]
keywords = [
    "evolution operators",
    "self-supervised learning",
    "dynamical systems",
    "molecular dynamics",
    "climate",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cartopy>=0.25.0",
    "cftime>=1.6.4",
    "h5py>=3.15.1",
    "huggingface-hub>=0.31.4",
    "ipykernel>=6.29.5",
    "itables>=2.4.0",
    "kooplearn>=1.1.3",
    "lightning>=2.5.1",
    "linear-operator-learning>=0.2.5",
    "lmdb>=1.6.2",
    "loguru>=0.7.3",
    "matplotlib>=3.9.0",
    "matscipy>=1.1.1",
    "mdtraj>=1.10.3",
    "mlcolvar",
    "netcdf4>=1.7.2",
    "nglview>=3.1.4",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "setuptools>=78.1.0",
    "timm>=1.0.15",
    "torch>=2.7.0",
    "torch-geometric>=2.6.1",
    "torch-scatter>=2.1.2",
    "tqdm>=4.67.1",
    "treescope>=0.1.9",
    "tyro>=0.9.18",
    "wandb>=0.19.8",
    "xarray>=2025.4.0",
]

[project.urls]
Homepage = "https://pietronvll.github.io/encoderops/"
Repository = "https://github.com/pietronvll/encoderops"
Paper = "https://openreview.net/forum?id=Ku3kLJle7Q"
Models-CSML-IIT = "https://huggingface.co/CSML-IIT/encoderops"
Models-pnovelli = "https://huggingface.co/pnovelli/encoderops"
Datasets-pnovelli = "https://huggingface.co/datasets/pnovelli/encoderops"
Datasets-CSML-IIT = "https://huggingface.co/datasets/CSML-IIT/encoderops"

[tool.uv.sources]
mlcolvar = { git = "https://github.com/luigibonati/mlcolvar.git", rev = "graphs_integration" }

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]

[dependency-groups]
dev = [
    "matplotx>=0.3.10",
]
